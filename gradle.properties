org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Play App Optimization / R8 (see developer.android.com app-optimization)
# Full mode is default since AGP 8 — never set android.enableR8.fullMode=false.
# AGP 9 enables optimized resource shrinking by default when shrinkResources is on;
# keep the flag explicit for clarity and for any AGP 8-compat tooling.
android.r8.optimizedResourceShrinking=true

# Gradual AGP 9 adoption: keep existing Kotlin Android + legacy DSL until
# we migrate to built-in Kotlin (required for android.newDsl=true).
android.builtInKotlin=false
android.newDsl=false
